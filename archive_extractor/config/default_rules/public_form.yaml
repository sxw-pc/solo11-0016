rule_id: public_form
name: 政务公示表
version: 1.0.0
form_type: public
description: 适配嵌套表格、公示期间、发布单位与多选标签等公示字段
match: {form_selector: "form#publicForm", marker: 'data-form-type="public"'}
fields:
  doc_no: {label: 公示编号, selector: 'input[name="doc_no"]', attr: value, type: text, required: true, validators: [{type: regex, pattern: '^GS-\d{4}-\d{4}$', message: 公示编号应为 GS-年份-四位序号}]}
  title: {label: 公示标题, selector: '#publicForm tr[data-field="title"] td.value', type: text, trim: true, required: true, validators: [{type: min_length, value: 4, message: 公示标题至少 4 个字符}]}
  department: {label: 发布单位, selector: 'select[name="department"]', type: enum, required: true, validators: [{type: enum, values: [综合服务处, 档案管理处, 项目审核处, 政务公开处], message: 发布单位不在允许范围内}]}
  publish_date: {label: 发布日期, selector: '#publicForm tr[data-field="publish_date"] td.value', type: date, required: true}
  period_start: {label: 公示开始日期, selector: 'input[name="period_start"]', attr: value, type: date, required: true}
  period_end: {label: 公示结束日期, selector: 'input[name="period_end"]', attr: value, type: date, required: true}
  contact_phone: {label: 咨询电话, selector: '#publicForm .contact-phone', type: text, required: true, validators: [{type: phone, message: 咨询电话格式不正确}]}
  content: {label: 公示内容, selector: 'textarea[name="content"]', type: text, trim: true, required: true, validators: [{type: min_length, value: 8, message: 公示内容至少 8 个字符}]}
  categories: {label: 公示标签, selector: 'input[name="categories"]:checked', attr: value, type: array, item_type: text, all: true, default: []}
  issuer: {label: 发布机构信息, selector: '#publicForm .issuer-box', type: object, fields: {office: {label: 科室, selector: .office, type: text}, address: {label: 地址, selector: .address, attr: data-address, type: text}}}
dedup: {primary_key: [doc_no], fuzzy_fields: [title, content], threshold: 0.97}
validations: [{type: date_order, start: period_start, end: period_end, level: error, message: 公示结束日期不得早于开始日期}, {type: date_order, start: publish_date, end: period_end, level: warning, message: 公示结束日期早于发布日期，请复核}]
